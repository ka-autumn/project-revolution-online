# プルリクエストと main への push で走る検査（#242）。公開リポジトリだけを取得するので private/ は無く、
# 非公開側のテストとデッキ構築の計測は走らない。秘密は使わない。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から取得される。
      - uses: pnpm/action-setup@v6

      # cache: pnpm は pnpm の store の場所を pnpm に問い合わせるので、pnpm をインストールした後に置く。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # 素の pnpm install は、private/ が無いとロックファイルから非公開側の importer を消す。
      - name: install
        run: pnpm install --frozen-lockfile

      - name: verify
        run: pnpm verify

      # Chromium のビルドは Playwright のバージョンごとに決まるので、バージョンをキャッシュのキーに含める。
      - name: Playwright のバージョンを取得
        id: playwright
        working-directory: packages/client
        run: echo "version=$(pnpm exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # キャッシュに当たってもブラウザの取得を省くだけで、OS のパッケージ（--with-deps）は毎回インストールする。
      - name: Chromium を取得
        working-directory: packages/client
        run: pnpm exec playwright install --with-deps chromium

      - name: 本物のブラウザのテスト
        run: pnpm test:browser
